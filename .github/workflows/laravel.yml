name: Laravel CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ssd_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: ✅ Checkout latest code
        uses: actions/checkout@v4

      # ── 2. PHP + Composer ──────────────────────────────────────────────────
      - name: 🐘 Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, xml, bcmath, ctype, json, tokenizer
          coverage: none

      - name: 📦 Install PHP dependencies (composer install)
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # ── 3. Node + npm ──────────────────────────────────────────────────────
      - name: 🟩 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Node dependencies (npm install)
        run: npm install

      # ── 4. App setup ───────────────────────────────────────────────────────
      - name: ⚙️ Create .env file
        run: cp .env.example .env

      - name: 🔑 Generate application key
        run: php artisan key:generate

      # ── 5. Laravel migrations ──────────────────────────────────────────────
      - name: 🗄️ Run Laravel migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ssd_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate --force

      # ── 6. PHPUnit tests ───────────────────────────────────────────────────
      - name: 🧪 Run PHPUnit tests (php artisan test)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ssd_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test

      # ── 7. Frontend build ──────────────────────────────────────────────────
      - name: 🏗️ Build frontend assets (npm run build)
        run: npm run build
