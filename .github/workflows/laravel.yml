name: Laravel CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: car_rental_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: testing
      APP_KEY: base64:SomeRandom32CharacterLongTestingKey=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: car_rental_test
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      # Step 1 — Checkout latest code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2 — Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, bcmath
          coverage: none

      # Step 2 — Install PHP dependencies
      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # Step 3 — Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Step 3 — Install Node dependencies
      - name: Install NPM Dependencies
        run: npm install

      # Prepare Laravel environment
      - name: Create Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      # Step 4 — Run migrations
      - name: Run Database Migrations
        run: php artisan migrate --force

      # Step 5 — Run PHPUnit tests
      - name: Run Test Suite
        run: php artisan test

      # Step 6 — Build frontend assets
      - name: Build Frontend Assets
        run: npm run build

